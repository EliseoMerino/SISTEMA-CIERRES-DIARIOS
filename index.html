<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cierre Diario DH</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- LIBRERÍA EXCEL -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>

<h2>CIERRE DIARIO</h2>

<div class="header">
  <div><strong>Designado:</strong> Stephanie Alejandra Estrada Echeverría</div>
  <div>
    <strong>Fecha:</strong>
    <input type="date" id="fecha">
  </div>
</div>

<table id="tabla">
  <thead>
    <tr>
      <th rowspan="2">VENDEDOR</th>
      <th rowspan="2">REFERENCIA</th>
      <th colspan="2">ENTREGA</th>
      <th colspan="2">DEVOLUCIÓN</th>
      <th colspan="3">$</th>
    </tr>
    <tr>
      <th>EDH</th>
      <th>MAS</th>
      <th>EDH</th>
      <th>MAS</th>
      <th>EDH</th>
      <th>MAS</th>
      <th>TOTAL</th>
    </tr>
  </thead>

  <tbody></tbody>

  <tfoot>
    <tr>
      <td colspan="8">TOTAL</td>
      <td id="totalGeneral">0.00</td>
    </tr>
  </tfoot>
</table>

<button onclick="exportarExcel()">DESCARGAR EXCEL</button>

<!-- JS -->
<script src="script.js"></script>
</body>
</html>
